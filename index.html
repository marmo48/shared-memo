<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>共有グリッド</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'JetBrains Mono', monospace;
      user-select: none;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(8, 48px);
      grid-template-rows: repeat(8, 48px);
      border-left: 1px solid #e0e0e0;
      border-top: 1px solid #e0e0e0;
      cursor: text;
    }

    .cell {
      width: 48px;
      height: 48px;
      border-right: 1px solid #e0e0e0;
      border-bottom: 1px solid #e0e0e0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      color: #222;
      position: relative;
    }

    /* カーソルのあるマス */
    .cell.cursor {
      background: #f0f0f0;
    }

    .cell.cursor::after {
      content: '';
      position: absolute;
      left: 50%;
      bottom: 7px;
      transform: translateX(-50%);
      width: 18px;
      height: 1.5px;
      background: #444;
      animation: blink 1s step-end infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* 擬似入力中のマス（未確定） */
    .cell.pending {
      color: #aaa;
    }

    /* 隠し input（IME受け取り用） */
    #ime {
      position: fixed;
      opacity: 0;
      pointer-events: none;
      width: 1px;
      height: 1px;
      top: 0; left: 0;
    }
  </style>
</head>
<body>

<div class="grid" id="grid"></div>
<input id="ime" type="text" autocomplete="off" />

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import {
    getDatabase, ref, set, onValue, update
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyC8wbN5gObR2tGkzOjwDSF5lNujRxLJ4bo",
    authDomain: "text-map-f6060.firebaseapp.com",
    databaseURL: "https://text-map-f6060-default-rtdb.firebaseio.com",
    projectId: "text-map-f6060",
    storageBucket: "text-map-f6060.firebasestorage.app",
    messagingSenderId: "640110471676",
    appId: "1:640110471676:web:75133b427ab91b2fa2aa79"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const COLS = 8, SIZE = 64;
  let serverFlat = Array(SIZE).fill(''); // サーバーの現在値
  let cursor = null;   // 選択中のマスindex
  let pending = '';    // 未確定の入力文字列

  // --- DOM ---
  const gridEl = document.getElementById('grid');
  const imeEl  = document.getElementById('ime');
  const cells  = [];

  for (let i = 0; i < SIZE; i++) {
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.addEventListener('click', () => {
      commitAndThen(() => setCursor(i));
    });
    gridEl.appendChild(cell);
    cells.push(cell);
  }

  // カーソルをセット
  function setCursor(i) {
    cursor = i;
    pending = '';
    imeEl.value = '';
    imeEl.focus();
    render();
  }

  // 画面を描画
  function render() {
    const pendingChars = [...pending]; // 文字単位で分割（絵文字等も考慮）

    for (let i = 0; i < SIZE; i++) {
      const cell = cells[i];
      const isCursor = (i === cursor && pending === '');
      const pendingIdx = (cursor !== null) ? i - cursor : -1;
      const isPending = cursor !== null && pendingIdx >= 0 && pendingIdx < pendingChars.length;

      cell.className = 'cell' +
        (isCursor ? ' cursor' : '') +
        (isPending ? ' pending' : '');

      if (isPending) {
        cell.textContent = pendingChars[pendingIdx];
      } else {
        cell.textContent = serverFlat[i] || '';
      }
    }
  }

  // --- Firebase ---
  const flatRef = ref(db, 'sharedGrid3/flat');

  onValue(flatRef, (snapshot) => {
    const data = snapshot.val();
    for (let i = 0; i < SIZE; i++) {
      serverFlat[i] = data && data[i] !== undefined ? data[i] : '';
    }
    render();
  });

  // pending文字列をサーバーに確定送信
  async function commitPending() {
    if (cursor === null || pending === '') return;
    const chars = [...pending];
    const updates = {};
    for (let j = 0; j < chars.length; j++) {
      const idx = cursor + j;
      if (idx >= SIZE) break;
      serverFlat[idx] = chars[j];
      updates[`sharedGrid3/flat/${idx}`] = chars[j];
    }
    await update(ref(db), updates);
    // カーソルを進める
    cursor = Math.min(cursor + chars.length, SIZE - 1);
    pending = '';
    imeEl.value = '';
  }

  // 確定してからコールバック実行
  async function commitAndThen(fn) {
    await commitPending();
    if (fn) fn();
  }

  // --- IME input イベント（未確定文字の擬似表示） ---
  imeEl.addEventListener('input', () => {
    if (cursor === null) return;
    pending = imeEl.value;
    render();
  });

  // --- キーイベント ---
  imeEl.addEventListener('keydown', async (e) => {
    if (cursor === null) return;

    // IME変換中（isComposing）はEnter以外は通常通り処理させる
    // ただしEnterはIMEの確定なので無視
    if (e.isComposing) return;

    if (e.key === 'Enter') {
      e.preventDefault();
      await commitPending();
      render();

    } else if (e.key === 'Backspace') {
      e.preventDefault();
      await commitAndThen(() => {
        // Backspace本来の動作：1マス削除して左へ
        if (cursor > 0) {
          cursor--;
          serverFlat[cursor] = '';
          update(ref(db), { [`sharedGrid3/flat/${cursor}`]: '' });
        }
        render();
      });

    } else if (e.key === 'ArrowRight') {
      e.preventDefault();
      await commitAndThen(() => {
        if (cursor < SIZE - 1) cursor++;
        render();
      });

    } else if (e.key === 'ArrowLeft') {
      e.preventDefault();
      await commitAndThen(() => {
        if (cursor > 0) cursor--;
        render();
      });

    } else if (e.key === 'ArrowDown') {
      e.preventDefault();
      await commitAndThen(() => {
        if (cursor + COLS < SIZE) cursor += COLS;
        render();
      });

    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      await commitAndThen(() => {
        if (cursor - COLS >= 0) cursor -= COLS;
        render();
      });

    } else if (e.key === 'Escape') {
      // 未確定を破棄してカーソル解除
      pending = '';
      imeEl.value = '';
      cursor = null;
      imeEl.blur();
      render();
    }
  });

  // グリッド外クリックで確定＆カーソル解除
  document.addEventListener('click', async (e) => {
    if (!gridEl.contains(e.target)) {
      await commitPending();
      cursor = null;
      render();
    }
  });

  // グリッドをクリックしたらIMEにフォーカス
  document.addEventListener('click', () => {
    if (cursor !== null) imeEl.focus();
  });
</script>

</body>
</html>
