<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>共有グリッド</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'JetBrains Mono', monospace;
      user-select: none;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(8, 32px);
      grid-template-rows: repeat(8, 32px);
      border-left: 1px solid #e0e0e0;
      border-top: 1px solid #e0e0e0;
      cursor: text;
    }

    .cell {
      width: 32px;
      height: 32px;
      border-right: 1px solid #e0e0e0;
      border-bottom: 1px solid #e0e0e0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      color: #222;
      position: relative;
    }

    /* カーソルのあるマス（待機中） */
    .cell.cursor {
      background: #f0f0f0;
    }

    .cell.cursor::after {
      content: '';
      position: absolute;
      left: 50%;
      bottom: 5px;
      transform: translateX(-50%);
      width: 14px;
      height: 1.5px;
      background: #444;
      animation: blink 1s step-end infinite;
    }

    /* 仮入力中：カーソル位置（最後の文字のマス） */
    .cell.cursor-pending {
      background: #f0f0f0;
    }

    .cell.cursor-pending::after {
      content: '';
      position: absolute;
      left: 50%;
      bottom: 5px;
      transform: translateX(-50%);
      width: 14px;
      height: 1.5px;
      background: #444;
      animation: blink 1s step-end infinite;
    }

    /* 仮入力中の文字（未確定） */
    .cell.pending {
      color: #aaa;
    }

    #ime {
      position: fixed;
      opacity: 0;
      pointer-events: none;
      width: 1px;
      height: 1px;
      top: 0; left: 0;
    }
  </style>
</head>
<body>

<div class="grid" id="grid"></div>
<input id="ime" type="text" autocomplete="off" />

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import {
    getDatabase, ref, onValue, update
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyC8wbN5gObR2tGkzOjwDSF5lNujRxLJ4bo",
    authDomain: "text-map-f6060.firebaseapp.com",
    databaseURL: "https://text-map-f6060-default-rtdb.firebaseio.com",
    projectId: "text-map-f6060",
    storageBucket: "text-map-f6060.firebasestorage.app",
    messagingSenderId: "640110471676",
    appId: "1:640110471676:web:75133b427ab91b2fa2aa79"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const COLS = 8, SIZE = 64;
  let serverFlat = Array(SIZE).fill('');
  let cursor = null;
  let pending = '';

  const gridEl = document.getElementById('grid');
  const imeEl  = document.getElementById('ime');
  const cells  = [];

  for (let i = 0; i < SIZE; i++) {
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.addEventListener('click', () => commitAndThen(() => setCursor(i)));
    gridEl.appendChild(cell);
    cells.push(cell);
  }

  function setCursor(i) {
    cursor = i;
    pending = '';
    imeEl.value = '';
    imeEl.focus();
    render();
  }

  function render() {
    const pendingChars = [...pending];
    const pendingLen = pendingChars.length;

    // 仮入力中のカーソル位置 = cursor + pendingLen - 1（最後の文字のマス）
    // pendingがなければ cursor がカーソル
    const cursorCell = (cursor !== null && pendingLen > 0)
      ? cursor + pendingLen - 1
      : cursor;

    for (let i = 0; i < SIZE; i++) {
      const cell = cells[i];
      const pendingIdx = (cursor !== null) ? i - cursor : -1;
      const isPending = cursor !== null && pendingIdx >= 0 && pendingIdx < pendingLen;
      const isCursorCell = (i === cursorCell && cursor !== null);

      let cls = 'cell';
      if (isPending && isCursorCell) {
        cls += ' pending cursor-pending'; // 最後の仮入力マス＝カーソル
      } else if (isPending) {
        cls += ' pending';
      } else if (isCursorCell) {
        cls += ' cursor'; // 待機中カーソル
      }
      cell.className = cls;
      cell.textContent = isPending ? pendingChars[pendingIdx] : (serverFlat[i] || '');
    }
  }

  // Firebase
  const flatRef = ref(db, 'sharedGrid3/flat');
  onValue(flatRef, (snapshot) => {
    const data = snapshot.val();
    for (let i = 0; i < SIZE; i++) {
      serverFlat[i] = data && data[i] !== undefined ? data[i] : '';
    }
    render();
  });

  async function commitPending() {
    if (cursor === null || pending === '') return;
    const chars = [...pending];
    const updates = {};
    for (let j = 0; j < chars.length; j++) {
      const idx = cursor + j;
      if (idx >= SIZE) break;
      serverFlat[idx] = chars[j];
      updates[`sharedGrid3/flat/${idx}`] = chars[j];
    }
    await update(ref(db), updates);
    cursor = Math.min(cursor + chars.length, SIZE - 1);
    pending = '';
    imeEl.value = '';
  }

  async function commitAndThen(fn) {
    await commitPending();
    if (fn) fn();
  }

  // 仮入力の擬似表示
  imeEl.addEventListener('input', () => {
    if (cursor === null) return;
    pending = imeEl.value;
    render();
  });

  imeEl.addEventListener('keydown', async (e) => {
    if (cursor === null) return;

    if (e.isComposing) return; // IME変換中はすべて無視

    if (e.key === 'Enter') {
      e.preventDefault();
      await commitPending();
      render();

    } else if (e.key === 'ArrowRight') {
      e.preventDefault();
      await commitAndThen(() => {
        if (cursor < SIZE - 1) cursor++;
        render();
      });

    } else if (e.key === 'ArrowLeft') {
      e.preventDefault();
      await commitAndThen(() => {
        if (cursor > 0) cursor--;
        render();
      });

    } else if (e.key === 'ArrowDown') {
      e.preventDefault();
      await commitAndThen(() => {
        if (cursor + COLS < SIZE) cursor += COLS;
        render();
      });

    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      await commitAndThen(() => {
        if (cursor - COLS >= 0) cursor -= COLS;
        render();
      });

    } else if (e.key === 'Backspace') {
      // Backspaceはブラウザに任せる（IME入力の修正に使う）
      // pendingがない場合のみ：1マス削除して左へ
      if (pending === '') {
        e.preventDefault();
        if (cursor > 0) {
          cursor--;
          serverFlat[cursor] = '';
          update(ref(db), { [`sharedGrid3/flat/${cursor}`]: '' });
          render();
        }
      }

    } else if (e.key === 'Escape') {
      pending = '';
      imeEl.value = '';
      cursor = null;
      imeEl.blur();
      render();
    }
  });

  document.addEventListener('click', async (e) => {
    if (!gridEl.contains(e.target)) {
      await commitPending();
      cursor = null;
      render();
    }
  });

  document.addEventListener('click', () => {
    if (cursor !== null) imeEl.focus();
  });
</script>

</body>
</html>
