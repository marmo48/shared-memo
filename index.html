<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>共有グリッド</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'JetBrains Mono', monospace;
      user-select: none;
      overflow: hidden;
    }

    .grid-wrapper {
      transform-origin: center center;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(20, 30px);
      grid-template-rows: repeat(20, 30px);
      border-left: 1px solid #e6e6e6;
      border-top: 1px solid #e6e6e6;
      cursor: text;
    }

    .cell {
      width: 30px;
      height: 30px;
      border-right: 1px solid #e0e0e0;
      border-bottom: 1px solid #e0e0e0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      color: #222;
      position: relative;
    }

    .cell.cursor {
      background: #f0f0f0;
    }

    .cell.cursor::after {
      content: '';
      position: absolute;
      left: 50%;
      bottom: 5px;
      transform: translateX(-50%);
      width: 14px;
      height: 1.5px;
      background: #444;
      animation: blink 1s step-end infinite;
    }

    .cell.cursor-pending {
      background: #f0f0f0;
    }

    .cell.cursor-pending::after {
      content: '';
      position: absolute;
      left: 50%;
      bottom: 5px;
      transform: translateX(-50%);
      width: 14px;
      height: 1.5px;
      background: #444;
      animation: blink 1s step-end infinite;
    }

    .cell.pending {
      color: #aaa;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* 隠しinput：画面外に出さず、位置だけ動かす */
    #ime {
      position: fixed;
      width: 1px;
      height: 1px;
      opacity: 0;
      border: none;
      outline: none;
      background: transparent;
      color: transparent;
      caret-color: transparent;
      font-size: 1rem;
      padding: 0;
      z-index: 9999;
    }
  </style>
</head>
<body>

<div class="grid-wrapper" id="wrapper">
  <div class="grid" id="grid"></div>
</div>
<input id="ime" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import {
    getDatabase, ref, onValue, update
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyC8wbN5gObR2tGkzOjwDSF5lNujRxLJ4bo",
    authDomain: "text-map-f6060.firebaseapp.com",
    databaseURL: "https://text-map-f6060-default-rtdb.firebaseio.com",
    projectId: "text-map-f6060",
    storageBucket: "text-map-f6060.firebasestorage.app",
    messagingSenderId: "640110471676",
    appId: "1:640110471676:web:75133b427ab91b2fa2aa79"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const COLS = 20, ROWS = 20, SIZE = COLS * ROWS;
  const CELL_SIZE = 30; // px（CSSと合わせる）
  const SCALE_MIN = 0.4, SCALE_MAX = 3.0, SCALE_STEP = 0.1;

  let serverFlat = Array(SIZE).fill('');
  let cursor = null;
  let pending = '';
  let scale = 1.0;

  const gridEl   = document.getElementById('grid');
  const wrapperEl= document.getElementById('wrapper');
  const imeEl    = document.getElementById('ime');
  const cells    = [];

  // グリッド構築
  for (let i = 0; i < SIZE; i++) {
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.addEventListener('click', () => commitAndThen(() => setCursor(i)));
    gridEl.appendChild(cell);
    cells.push(cell);
  }

  // カーソルをセット
  function setCursor(i) {
    cursor = i;
    pending = '';
    imeEl.value = '';
    moveIme();
    imeEl.focus();
    render();
  }

  // 隠しinputをカーソルマスの右に移動
  function moveIme() {
    if (cursor === null) return;
    const pendingChars = [...pending];
    const pendingLen = pendingChars.length;
    // 表示上のカーソルマス
    const activeCellIdx = pendingLen > 0
      ? Math.min(cursor + pendingLen - 1, SIZE - 1)
      : cursor;

    const cell = cells[activeCellIdx];
    const rect = cell.getBoundingClientRect();
    // マスの右端・上端に配置
    imeEl.style.left = (rect.right) + 'px' * 2;
    imeEl.style.top  = rect.top ;
  }

  // 描画
  function render() {
    const pendingChars = [...pending];
    const pendingLen = pendingChars.length;
    const cursorCell = (cursor !== null && pendingLen > 0)
      ? Math.min(cursor + pendingLen - 1, SIZE - 1)
      : cursor;

    for (let i = 0; i < SIZE; i++) {
      const cell = cells[i];
      const pendingIdx = cursor !== null ? i - cursor : -1;
      const isPending = cursor !== null && pendingIdx >= 0 && pendingIdx < pendingLen;
      const isCursorCell = (i === cursorCell && cursor !== null);

      let cls = 'cell';
      if (isPending && isCursorCell) {
        cls += ' pending cursor-pending';
      } else if (isPending) {
        cls += ' pending';
      } else if (isCursorCell) {
        cls += ' cursor';
      }
      cell.className = cls;
      cell.textContent = isPending ? pendingChars[pendingIdx] : (serverFlat[i] || '');
    }

    moveIme();
  }

  // Firebase
  const flatRef = ref(db, 'sharedGrid4/flat');
  onValue(flatRef, (snapshot) => {
    const data = snapshot.val();
    for (let i = 0; i < SIZE; i++) {
      serverFlat[i] = data && data[i] !== undefined ? data[i] : '';
    }
    render();
  });

  async function commitPending() {
    if (cursor === null || pending === '') return;
    const chars = [...pending];
    const updates = {};
    for (let j = 0; j < chars.length; j++) {
      const idx = cursor + j;
      if (idx >= SIZE) break;
      serverFlat[idx] = chars[j];
      updates[`sharedGrid4/flat/${idx}`] = chars[j];
    }
    await update(ref(db), updates);
    cursor = Math.min(cursor + chars.length, SIZE - 1);
    pending = '';
    imeEl.value = '';
  }

  async function commitAndThen(fn) {
    await commitPending();
    if (fn) fn();
  }

  // 仮入力の擬似表示
  imeEl.addEventListener('input', () => {
    if (cursor === null) return;
    pending = imeEl.value;
    render();
  });

  imeEl.addEventListener('keydown', async (e) => {
    if (cursor === null) return;
    if (e.isComposing) return;

    if (e.key === 'Enter') {
      e.preventDefault();
      await commitPending();
      render();

    } else if (e.key === 'ArrowRight') {
      e.preventDefault();
      await commitAndThen(() => { if (cursor < SIZE - 1) cursor++; render(); });

    } else if (e.key === 'ArrowLeft') {
      e.preventDefault();
      await commitAndThen(() => { if (cursor > 0) cursor--; render(); });

    } else if (e.key === 'ArrowDown') {
      e.preventDefault();
      await commitAndThen(() => { if (cursor + COLS < SIZE) cursor += COLS; render(); });

    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      await commitAndThen(() => { if (cursor - COLS >= 0) cursor -= COLS; render(); });

    } else if (e.key === 'Backspace' && pending === '') {
      e.preventDefault();
      if (cursor > 0) {
        cursor--;
        serverFlat[cursor] = '';
        update(ref(db), { [`sharedGrid4/flat/${cursor}`]: '' });
        render();
      }

    } else if (e.key === 'Escape') {
      pending = '';
      imeEl.value = '';
      cursor = null;
      imeEl.blur();
      render();
    }
  });

  // グリッド外クリックで確定＆カーソル解除
  document.addEventListener('click', async (e) => {
    if (!gridEl.contains(e.target)) {
      await commitPending();
      cursor = null;
      render();
    }
  });

  document.addEventListener('click', () => {
    if (cursor !== null) imeEl.focus();
  });

  // マウスホイールで拡大縮小
  document.addEventListener('wheel', (e) => {
    e.preventDefault();
    const delta = e.deltaY < 0 ? SCALE_STEP : -SCALE_STEP;
    scale = Math.min(SCALE_MAX, Math.max(SCALE_MIN, scale + delta));
    wrapperEl.style.transform = `scale(${scale})`;
    // スケール変更後にimeの位置も更新
    requestAnimationFrame(() => moveIme());
  }, { passive: false });

</script>

</body>
</html>
