<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>共有グリッド</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'JetBrains Mono', monospace;
      gap: 2rem;
      user-select: none;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(8, 48px);
      grid-template-rows: repeat(8, 48px);
      border-left: 1px solid #e0e0e0;
      border-top: 1px solid #e0e0e0;
      cursor: pointer;
    }

    .cell {
      width: 48px;
      height: 48px;
      border-right: 1px solid #e0e0e0;
      border-bottom: 1px solid #e0e0e0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      color: #222;
      position: relative;
      transition: background 0.1s;
    }

    .cell.selected {
      background: #f0f0f0;
    }

    .cell.selected::after {
      content: '';
      position: absolute;
      left: 50%;
      bottom: 8px;
      transform: translateX(-50%);
      width: 18px;
      height: 1.5px;
      background: #444;
      animation: blink 1s step-end infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    input {
      border: none;
      border-bottom: 1.5px solid #ccc;
      outline: none;
      font-family: 'JetBrains Mono', monospace;
      font-size: 1rem;
      padding: 0.4rem 0.2rem;
      width: 384px;
      color: #222;
      background: transparent;
      transition: border-color 0.2s;
      user-select: text;
    }

    input:focus {
      border-bottom-color: #888;
    }

    input::placeholder {
      color: #ccc;
    }

    input:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="grid" id="grid"></div>
  <input type="text" id="inputText" placeholder="マスを選択して入力…" disabled />

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyC8wbN5gObR2tGkzOjwDSF5lNujRxLJ4bo",
    authDomain: "text-map-f6060.firebaseapp.com",
    databaseURL: "https://text-map-f6060-default-rtdb.firebaseio.com",
    projectId: "text-map-f6060",
    storageBucket: "text-map-f6060.firebasestorage.app",
    messagingSenderId: "640110471676",
    appId: "1:640110471676:web:75133b427ab91b2fa2aa79"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const COLS = 8;
  let flat = Array(64).fill('');
  let cursor = null;

  // --- DOM構築 ---
  const gridEl = document.getElementById('grid');
  const inputEl = document.getElementById('inputText');
  const cells = [];

  for (let i = 0; i < 64; i++) {
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.addEventListener('click', () => setCursor(i));
    gridEl.appendChild(cell);
    cells.push(cell);
  }

  function setCursor(i) {
    cursor = i;
    inputEl.disabled = false;
    inputEl.value = '';
    inputEl.focus();
    render();
  }

  function render() {
    for (let i = 0; i < 64; i++) {
      cells[i].textContent = flat[i] || '';
      cells[i].classList.toggle('selected', i === cursor);
    }
  }

  // --- Firebase リアルタイム同期 ---
  const flatRef = ref(db, 'sharedGrid2/flat');

  onValue(flatRef, (snapshot) => {
    const data = snapshot.val();
    for (let i = 0; i < 64; i++) {
      flat[i] = data && data[i] !== undefined ? data[i] : '';
    }
    render();
  });

  // 複数マスをまとめて更新
  async function updateCells(startIndex, text) {
    const updates = {};
    for (let j = 0; j < text.length; j++) {
      const idx = startIndex + j;
      if (idx >= 64) break;
      flat[idx] = text[j];
      updates[`sharedGrid2/flat/${idx}`] = text[j];
    }
    // まとめて書き込み
    const { update } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js");
    await update(ref(db), updates);
    // カーソルを入力した文字数分進める
    const newCursor = Math.min(startIndex + text.length, 63);
    setCursor(newCursor);
  }

  // --- Enter で送信 ---
  inputEl.addEventListener('keydown', async (e) => {
    if (e.key !== 'Enter' || e.isComposing) return; // IME変換中は無視
    e.preventDefault();
    const text = inputEl.value;
    if (!text || cursor === null) return;
    await updateCells(cursor, text);
    inputEl.value = '';
  });

  // グリッド外クリックでカーソル解除
  document.addEventListener('click', (e) => {
    if (!gridEl.contains(e.target) && e.target !== inputEl) {
      cursor = null;
      inputEl.disabled = true;
      inputEl.value = '';
      render();
    }
  });
</script>

</body>
</html>
