<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>共有グリッド</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #fff;
      overflow: hidden;
      width: 100vw; height: 100vh;
      font-family: 'JetBrains Mono', monospace;
      user-select: none;
    }
    #canvas { position: absolute; top: 0; left: 0; cursor: text; }
    #ui {
      position: fixed; top: 12px; left: 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem; color: #bbb;
      letter-spacing: 0.05em; pointer-events: none; z-index: 100;
    }
    /* #color-btn {
      position: fixed; top: 10px; right: 12px;
      width: 22px; height: 22px; border-radius: 50%;
      border: 2px solid #fff;
      box-shadow: 0 0 0 1px #ddd;
      cursor: pointer; z-index: 100;
      transition: transform 0.15s;
    }
    #color-btn:hover { transform: scale(1.15); } */
    #ime {
      position: fixed; width: 1px; height: 1px; opacity: 0;
      border: none; outline: none; background: transparent;
      color: transparent; caret-color: transparent;
      font-size: 1rem; padding: 0; z-index: 9999;
    }
  </style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="ui">0, 0</div>
<div id="color-btn"></div>
<input id="ime" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, onValue, update, off } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyC8wbN5gObR2tGkzOjwDSF5lNujRxLJ4bo",
    authDomain: "text-map-f6060.firebaseapp.com",
    databaseURL: "https://text-map-f6060-default-rtdb.firebaseio.com",
    projectId: "text-map-f6060",
    storageBucket: "text-map-f6060.firebasestorage.app",
    messagingSenderId: "640110471676",
    appId: "1:640110471676:web:75133b427ab91b2fa2aa79"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  // ---- 定数 ----
  const GRID_W = 1000, GRID_H = 1000;
  const CHUNK = 10;
  const CELL = 22;
  const SCALE_MIN = 0.3, SCALE_MAX = 4.0, SCALE_STEP = 0.08;
  const WRAP = 15; // 折り返し幅

  // ---- カラーシステム ----
  // 背景用（薄い色）
  function colorIdToHsl(id) {
    const hue   = (id % 64) * (360 / 64);
    const sat   = (Math.floor(id / 64) % 2 === 0) ? 55 : 80;
    const light = (Math.floor(id / 128) === 0)     ? 55 : 75;
    return `hsl(${hue.toFixed(1)}, ${sat}%, ${light}%)`;
  }
  // 文字用（濃い色）
  function colorIdToHslDark(id) {
    const hue   = (id % 64) * (360 / 64);
    const sat   = (Math.floor(id / 64) % 2 === 0) ? 70 : 90;
    const light = (Math.floor(id / 128) === 0)     ? 28 : 38;
    return `hsl(${hue.toFixed(1)}, ${sat}%, ${light}%)`;
  }

  function getMyColorId() {
    try {
      localStorage.setItem('_test', '1');
      localStorage.removeItem('_test');
      let id = localStorage.getItem('myColorId');
      if (id === null) {
        id = Math.floor(Math.random() * 256);
        localStorage.setItem('myColorId', String(id));
      }
      return parseInt(id, 10);
    } catch (e) {
      return null; // シークレット → グレー
    }
  }

  let myColorId = getMyColorId();
  function myColor() {
    return myColorId === null ? '#aaa' : colorIdToHsl(myColorId);
  }

  // const colorBtn = document.getElementById('color-btn');
  // function updateColorBtn() { colorBtn.style.background = myColor(); }
  // updateColorBtn();
  //
  // colorBtn.addEventListener('click', () => {
  //   myColorId = Math.floor(Math.random() * 256);
  //   try { localStorage.setItem('myColorId', String(myColorId)); } catch (e) {}
  //   updateColorBtn();
  //   draw();
  // });

  // ---- 状態 ----
  let scale = 1.0;
  let viewX = 500.0; // Math.floor(Math.random() * (GRID_W - 40));
  let viewY = 500.0; // Math.floor(Math.random() * (GRID_H - 40));
  let cursor = null;
  let anchorCol = null;
  let pending = '';
  let isCommitting = false; // 二重Enter防止フラグ

  const chunkCache = {};
  const subscriptions = {};

  // ---- Canvas ----
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const imeEl = document.getElementById('ime');
  const uiEl  = document.getElementById('ui');

  function resize() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
    draw();
  }
  window.addEventListener('resize', resize);

  // ---- チャンク管理 ----
  function chunkKey(cx, cy) { return `${cx}_${cy}`; }

  function ensureCache(key) {
    if (!chunkCache[key]) {
      chunkCache[key] = { flat: Array(CHUNK * CHUNK).fill(''), colors: Array(CHUNK * CHUNK).fill(null) };
    }
  }

  function getCell(gx, gy) {
    if (gx < 0 || gy < 0 || gx >= GRID_W || gy >= GRID_H) return { char: '', colorId: null };
    const key = chunkKey(Math.floor(gx / CHUNK), Math.floor(gy / CHUNK));
    const cache = chunkCache[key];
    if (!cache) return { char: '', colorId: null };
    const idx = (gy % CHUNK) * CHUNK + (gx % CHUNK);
    return { char: cache.flat[idx] || '', colorId: cache.colors[idx] };
  }

  function setCellCache(gx, gy, char, colorId) {
    if (gx < 0 || gy < 0 || gx >= GRID_W || gy >= GRID_H) return;
    const key = chunkKey(Math.floor(gx / CHUNK), Math.floor(gy / CHUNK));
    ensureCache(key);
    const idx = (gy % CHUNK) * CHUNK + (gx % CHUNK);
    chunkCache[key].flat[idx]   = char;
    chunkCache[key].colors[idx] = colorId;
  }

  function subscribeChunk(cx, cy) {
    const key = chunkKey(cx, cy);
    if (subscriptions[key]) return;
    ensureCache(key);
    const flatRef   = ref(db, `map/chunks/${key}/flat`);
    const colorsRef = ref(db, `map/chunks/${key}/colors`);
    onValue(flatRef, (snap) => {
      const data = snap.val();
      for (let i = 0; i < CHUNK * CHUNK; i++)
        chunkCache[key].flat[i] = data && data[i] !== undefined ? data[i] : '';
      draw();
    });
    onValue(colorsRef, (snap) => {
      const data = snap.val();
      for (let i = 0; i < CHUNK * CHUNK; i++)
        chunkCache[key].colors[i] = data && data[i] !== undefined ? data[i] : null;
      draw();
    });
    subscriptions[key] = () => { off(flatRef); off(colorsRef); };
  }

  function unsubscribeChunk(cx, cy) {
    const key = chunkKey(cx, cy);
    if (!subscriptions[key]) return;
    subscriptions[key]();
    delete subscriptions[key];
  }

  function syncSubscriptions() {
    const cellPx = CELL * scale;
    const startCX = Math.max(0, Math.floor(viewX / CHUNK) - 1);
    const startCY = Math.max(0, Math.floor(viewY / CHUNK) - 1);
    const endCX = Math.min(GRID_W / CHUNK - 1, startCX + Math.ceil(canvas.width  / cellPx / CHUNK) + 2);
    const endCY = Math.min(GRID_H / CHUNK - 1, startCY + Math.ceil(canvas.height / cellPx / CHUNK) + 2);
    const needed = new Set();
    for (let cy = startCY; cy <= endCY; cy++)
      for (let cx = startCX; cx <= endCX; cx++) {
        needed.add(chunkKey(cx, cy));
        subscribeChunk(cx, cy);
      }
    for (const key of Object.keys(subscriptions))
      if (!needed.has(key)) { const [cx, cy] = key.split('_').map(Number); unsubscribeChunk(cx, cy); }
  }

  // ---- 折り返し座標計算 ----
  // anchorColを起点にn文字目のグリッド座標を返す
  function wrappedPos(anchorCol, anchorRow, n) {
    const row = anchorRow + Math.floor(n / WRAP);
    const col = anchorCol + (n % WRAP);
    return { gx: col, gy: row };
  }

  // ---- 描画 ----
  function gridToScreen(gx, gy) {
    return { sx: (gx - viewX) * CELL * scale, sy: (gy - viewY) * CELL * scale };
  }
  function screenToGrid(sx, sy) {
    return {
      gx: Math.floor(sx / (CELL * scale) + viewX),
      gy: Math.floor(sy / (CELL * scale) + viewY),
    };
  }

  function draw() {
    const w = canvas.width, h = canvas.height;
    ctx.clearRect(0, 0, w, h);
    const cellPx = CELL * scale;

    // 仮入力の折り返し座標を事前計算
    const pendingChars = [...pending];
    const pendingLen = pendingChars.length;

    // 仮入力マスのセット: "gx_gy" -> { char, isLast }
    const pendingMap = new Map();
    if (cursor && pendingLen > 0) {
      for (let j = 0; j < pendingLen; j++) {
        const { gx, gy } = wrappedPos(anchorCol ?? cursor.gx, cursor.gy, cursor.gx - (anchorCol ?? cursor.gx) + j);
        pendingMap.set(`${gx}_${gy}`, { char: pendingChars[j], isLast: j === pendingLen - 1 });
      }
    }

    // カーソルマス
    let cursorKey = null;
    if (cursor) {
      if (pendingLen > 0) {
        // 仮入力中：最後の仮入力マス
        const { gx, gy } = wrappedPos(anchorCol ?? cursor.gx, cursor.gy, cursor.gx - (anchorCol ?? cursor.gx) + pendingLen - 1);
        cursorKey = `${gx}_${gy}`;
      } else {
        cursorKey = `${cursor.gx}_${cursor.gy}`;
      }
    }

    const startGX = Math.floor(viewX);
    const startGY = Math.floor(viewY);
    const endGX = Math.min(GRID_W - 1, startGX + Math.ceil(w / cellPx) + 1);
    const endGY = Math.min(GRID_H - 1, startGY + Math.ceil(h / cellPx) + 1);

    ctx.font = `${Math.round(cellPx * 0.6)}px 'JetBrains Mono', monospace`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    for (let gy = startGY; gy <= endGY; gy++) {
      for (let gx = startGX; gx <= endGX; gx++) {
        const { sx, sy } = gridToScreen(gx, gy);
        const key = `${gx}_${gy}`;
        const pEntry = pendingMap.get(key);
        const isPending = !!pEntry;
        const isCursorCell = key === cursorKey;

        // グリッド線
        ctx.strokeStyle = '#f4f4f4';
        ctx.lineWidth = 1;
        ctx.strokeRect(sx, sy, cellPx, cellPx);

        // 背景
        if (isPending) {
          ctx.fillStyle = myColor();
          ctx.globalAlpha = 0.15;
          ctx.fillRect(sx, sy, cellPx, cellPx);
          ctx.globalAlpha = 1;
        } else {
          const { char, colorId } = getCell(gx, gy);
          if (char && colorId !== null) {
            ctx.fillStyle = colorIdToHsl(colorId);
            ctx.globalAlpha = 0.15;
            ctx.fillRect(sx, sy, cellPx, cellPx);
            ctx.globalAlpha = 1;
          }
        }

        if (isCursorCell) {
          ctx.fillStyle = '#e8e8e8';
          ctx.fillRect(sx, sy, cellPx, cellPx);
        }

        // 文字
        let char, color;
        if (isPending) {
          char  = pEntry.char;
          color = myColorId !== null ? colorIdToHslDark(myColorId) : '#888';
          ctx.globalAlpha = 0.6;
        } else {
          const cell = getCell(gx, gy);
          char  = cell.char;
          color = cell.colorId !== null ? colorIdToHslDark(cell.colorId) : '#222';
          ctx.globalAlpha = 1;
        }
        if (char) {
          ctx.fillStyle = color;
          ctx.fillText(char, sx + cellPx / 2, sy + cellPx / 2);
        }
        ctx.globalAlpha = 1;

        // カーソル下線
        if (isCursorCell) {
          ctx.fillStyle = '#444';
          const uw = cellPx * 0.5;
          ctx.fillRect(sx + (cellPx - uw) / 2, sy + cellPx - cellPx * 0.15, uw, Math.max(1, cellPx * 0.06));
        }
      }
    }

    updateUI();
  }

  function updateUI() {
    if (cursor) {
      uiEl.textContent = `${cursor.gx}, ${cursor.gy}`;
    } else {
      const cx = Math.round(viewX + canvas.width  / (CELL * scale) / 2);
      const cy = Math.round(viewY + canvas.height / (CELL * scale) / 2);
      uiEl.textContent = `${cx}, ${cy}`;
    }
  }

  // ---- IME位置（常にカーソルマスの右下）----
  function moveIme() {
    if (!cursor) return;
    const pendingLen = [...pending].length;
    let activeGX, activeGY;
    if (pendingLen > 0) {
      // 仮入力中：折り返し後の最後の文字のマス
      const pos = wrappedPos(anchorCol ?? cursor.gx, cursor.gy, cursor.gx - (anchorCol ?? cursor.gx) + pendingLen - 1);
      activeGX = pos.gx; activeGY = pos.gy;
    } else {
      activeGX = cursor.gx; activeGY = cursor.gy;
    }
    const { sx, sy } = gridToScreen(activeGX, activeGY);
    const cellPx = CELL * scale;
    imeEl.style.left = (sx + cellPx + 4) + 'px';
    imeEl.style.top  = (sy + cellPx / 2 + 4) + 'px';
  }

  // ---- カーソル操作 ----
  function setCursor(gx, gy, isClick = false) {
    gx = Math.max(0, Math.min(GRID_W - 1, gx));
    gy = Math.max(0, Math.min(GRID_H - 1, gy));
    cursor = { gx, gy };
    pending = '';
    imeEl.value = '';
    if (isClick) anchorCol = gx;
    moveIme();
    imeEl.focus();
    draw();
  }

  // ---- Firebase書き込み（折り返し対応）----
  async function commitPending() {
    if (!cursor || pending === '' || isCommitting) return;
    isCommitting = true;
    const chars = [...pending];
    const updates = {};
    const startOffset = cursor.gx - (anchorCol ?? cursor.gx);
    for (let j = 0; j < chars.length; j++) {
      const { gx, gy } = wrappedPos(anchorCol ?? cursor.gx, cursor.gy, startOffset + j);
      if (gx >= GRID_W || gy >= GRID_H) break;
      const key = chunkKey(Math.floor(gx / CHUNK), Math.floor(gy / CHUNK));
      const idx = (gy % CHUNK) * CHUNK + (gx % CHUNK);
      setCellCache(gx, gy, chars[j], myColorId);
      updates[`map/chunks/${key}/flat/${idx}`]   = chars[j];
      updates[`map/chunks/${key}/colors/${idx}`] = myColorId !== null ? myColorId : 128;
    }
    await update(ref(db), updates);

    // カーソルを折り返し考慮で進める
    const endPos = wrappedPos(anchorCol ?? cursor.gx, cursor.gy, startOffset + chars.length);
    cursor.gx = Math.min(endPos.gx, GRID_W - 1);
    cursor.gy = Math.min(endPos.gy, GRID_H - 1);
    pending = '';
    imeEl.value = '';
    isCommitting = false;
  }

  async function commitAndThen(fn) {
    await commitPending();
    if (fn) fn();
  }

  // ---- IMEイベント ----
  imeEl.addEventListener('input', () => {
    if (!cursor) return;
    pending = imeEl.value;
    moveIme();
    draw();
  });

  imeEl.addEventListener('keydown', async (e) => {
    if (!cursor) return;
    if (e.isComposing) return;
    if (isCommitting) { e.preventDefault(); return; } // 処理中は無視

    if (e.key === 'Enter') {
      e.preventDefault();
      if (pending !== '') {
        await commitPending();
        draw();
      } else {
        // 改行：anchorColの列、一段下へ
        const nextGY = cursor.gy + 1;
        if (nextGY < GRID_H && anchorCol !== null) setCursor(anchorCol, nextGY);
      }
    } else if (e.key === 'ArrowRight') {
      e.preventDefault();
      await commitAndThen(() => setCursor(cursor.gx + 1, cursor.gy));
    } else if (e.key === 'ArrowLeft') {
      e.preventDefault();
      await commitAndThen(() => setCursor(cursor.gx - 1, cursor.gy));
    } else if (e.key === 'ArrowDown') {
      e.preventDefault();
      await commitAndThen(() => setCursor(cursor.gx, cursor.gy + 1));
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      await commitAndThen(() => setCursor(cursor.gx, cursor.gy - 1));
    } else if (e.key === 'Escape') {
      pending = ''; imeEl.value = '';
      cursor = null; anchorCol = null;
      imeEl.blur(); draw();
    }
    // Backspaceは何もしない（削除機能なし）
  });

  // ---- マウス ----
  let drag = null;

  canvas.addEventListener('mousedown', (e) => {
    drag = { startX: e.clientX, startY: e.clientY, startViewX: viewX, startViewY: viewY, moved: false };
  });
  window.addEventListener('mousemove', (e) => {
    if (!drag) return;
    const dx = e.clientX - drag.startX, dy = e.clientY - drag.startY;
    if (Math.abs(dx) > 3 || Math.abs(dy) > 3) drag.moved = true;
    if (!drag.moved) return;
    viewX = Math.max(0, Math.min(GRID_W - 1, drag.startViewX - dx / (CELL * scale)));
    viewY = Math.max(0, Math.min(GRID_H - 1, drag.startViewY - dy / (CELL * scale)));
    syncSubscriptions(); moveIme(); draw();
  });
  window.addEventListener('mouseup', () => { drag = null; });

  canvas.addEventListener('click', (e) => {
    if (drag && drag.moved) return;
    const { gx, gy } = screenToGrid(e.clientX, e.clientY);
    if (gx >= 0 && gx < GRID_W && gy >= 0 && gy < GRID_H)
      commitAndThen(() => setCursor(gx, gy, true));
  });

  document.addEventListener('click', (e) => {
    if (e.target !== canvas && e.target !== colorBtn) {
      commitPending().then(() => { cursor = null; anchorCol = null; draw(); });
    } else if (cursor) { imeEl.focus(); }
  });

  // ---- タッチ（スワイプ + ピンチ）----
  let touch = null;
  let pinch = null; // { dist, viewX, viewY, midGX, midGY }

  function touchDist(e) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    return Math.sqrt(dx * dx + dy * dy);
  }
  function touchMid(e) {
    return {
      x: (e.touches[0].clientX + e.touches[1].clientX) / 2,
      y: (e.touches[0].clientY + e.touches[1].clientY) / 2,
    };
  }

  canvas.addEventListener('touchstart', (e) => {
    if (e.touches.length === 1) {
      const t = e.touches[0];
      touch = { startX: t.clientX, startY: t.clientY, startViewX: viewX, startViewY: viewY, moved: false };
      pinch = null;
    } else if (e.touches.length === 2) {
      touch = null;
      const mid = touchMid(e);
      const { gx, gy } = screenToGrid(mid.x, mid.y);
      pinch = { dist: touchDist(e), scale, midGX: gx, midGY: gy, midX: mid.x, midY: mid.y };
    }
  }, { passive: true });

  canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    if (e.touches.length === 2 && pinch) {
      // ピンチ拡大縮小
      const newDist = touchDist(e);
      const ratio = newDist / pinch.dist;
      scale = Math.max(SCALE_MIN, Math.min(SCALE_MAX, pinch.scale * ratio));
      // ピンチ中心点のグリッド座標を維持
      viewX = pinch.midGX - pinch.midX / (CELL * scale);
      viewY = pinch.midGY - pinch.midY / (CELL * scale);
      viewX = Math.max(0, Math.min(GRID_W - 1, viewX));
      viewY = Math.max(0, Math.min(GRID_H - 1, viewY));
      syncSubscriptions(); moveIme(); draw();
    } else if (e.touches.length === 1 && touch) {
      // スワイプ移動
      const t = e.touches[0];
      const dx = t.clientX - touch.startX, dy = t.clientY - touch.startY;
      if (Math.abs(dx) > 3 || Math.abs(dy) > 3) touch.moved = true;
      viewX = Math.max(0, Math.min(GRID_W - 1, touch.startViewX - dx / (CELL * scale)));
      viewY = Math.max(0, Math.min(GRID_H - 1, touch.startViewY - dy / (CELL * scale)));
      syncSubscriptions(); moveIme(); draw();
    }
  }, { passive: false });

  canvas.addEventListener('touchend', (e) => {
    if (e.touches.length < 2) pinch = null;
    if (touch && !touch.moved && e.touches.length === 0) {
      const t = e.changedTouches[0];
      const { gx, gy } = screenToGrid(t.clientX, t.clientY);
      if (gx >= 0 && gx < GRID_W && gy >= 0 && gy < GRID_H)
        commitAndThen(() => setCursor(gx, gy, true));
    }
    if (e.touches.length === 0) touch = null;
  });

  // ---- ホイール ----
  window.addEventListener('wheel', (e) => {
    e.preventDefault();
    if (e.ctrlKey || e.metaKey) {
      const { gx: mx, gy: my } = screenToGrid(e.clientX, e.clientY);
      scale += e.deltaY < 0 ? SCALE_STEP : -SCALE_STEP;
      scale = Math.max(SCALE_MIN, Math.min(SCALE_MAX, scale));
      viewX = mx - e.clientX / (CELL * scale);
      viewY = my - e.clientY / (CELL * scale);
    } else if (e.shiftKey) {
      // Mac は Shift+ホイールで deltaX に入る、Windows は deltaY に入る
      const d = e.deltaX !== 0 ? e.deltaX : e.deltaY;
      viewX += d / (CELL * scale);
    } else {
      viewY += e.deltaY / (CELL * scale);
      viewX += e.deltaX / (CELL * scale);
    }
    viewX = Math.max(0, Math.min(GRID_W - 1, viewX));
    viewY = Math.max(0, Math.min(GRID_H - 1, viewY));
    syncSubscriptions(); moveIme(); draw();
  }, { passive: false });

  // ---- 初期化 ----
  resize();
  syncSubscriptions();
  draw();
</script>
</body>
</html>
