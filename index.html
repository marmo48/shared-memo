<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>共有グリッド</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'JetBrains Mono', monospace;
      user-select: none;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(8, 48px);
      grid-template-rows: repeat(8, 48px);
      border-left: 1px solid #e0e0e0;
      border-top: 1px solid #e0e0e0;
      cursor: pointer;
    }

    .cell {
      width: 48px;
      height: 48px;
      border-right: 1px solid #e0e0e0;
      border-bottom: 1px solid #e0e0e0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      color: #222;
      position: relative;
      transition: background 0.1s;
    }

    .cell.selected {
      background: #f0f0f0;
    }

    /* カーソル（点滅） */
    .cell.selected::after {
      content: '';
      position: absolute;
      left: 50%;
      bottom: 8px;
      transform: translateX(-50%);
      width: 18px;
      height: 1.5px;
      background: #444;
      animation: blink 1s step-end infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>
</head>
<body>

  <div class="grid" id="grid"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyC8wbN5gObR2tGkzOjwDSF5lNujRxLJ4bo",
    authDomain: "text-map-f6060.firebaseapp.com",
    databaseURL: "https://text-map-f6060-default-rtdb.firebaseio.com",
    projectId: "text-map-f6060",
    storageBucket: "text-map-f6060.firebasestorage.app",
    messagingSenderId: "640110471676",
    appId: "1:640110471676:web:75133b427ab91b2fa2aa79"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const ROWS = 8, COLS = 8;
  let flat = Array(64).fill('');
  let cursor = null; // null = 未選択

  // --- DOM構築 ---
  const gridEl = document.getElementById('grid');
  const cells = [];

  for (let i = 0; i < 64; i++) {
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.addEventListener('click', () => setCursor(i));
    gridEl.appendChild(cell);
    cells.push(cell);
  }

  function setCursor(i) {
    cursor = i;
    render();
  }

  function render() {
    for (let i = 0; i < 64; i++) {
      cells[i].textContent = flat[i] || '';
      cells[i].classList.toggle('selected', i === cursor);
    }
  }

  // --- Firebaseリアルタイム同期 ---
  const flatRef = ref(db, 'sharedGrid2/flat');

  onValue(flatRef, (snapshot) => {
    const data = snapshot.val();
    if (data) {
      // Firebaseは配列をオブジェクトで返すことがあるので変換
      for (let i = 0; i < 64; i++) {
        flat[i] = data[i] !== undefined ? data[i] : '';
      }
    } else {
      flat = Array(64).fill('');
    }
    render();
  });

  // 1マスだけ更新
  async function updateCell(i, char) {
    flat[i] = char;
    await set(ref(db, `sharedGrid2/flat/${i}`), char);
  }

  // --- キー入力 ---
  document.addEventListener('keydown', async (e) => {
    if (cursor === null) return;

    if (e.key === 'Backspace') {
      e.preventDefault();
      await updateCell(cursor, '');
      if (cursor > 0) setCursor(cursor - 1);

    } else if (e.key.length === 1) {
      // 1文字の通常入力
      await updateCell(cursor, e.key);
      if (cursor < 63) setCursor(cursor + 1);

    } else if (e.key === 'ArrowRight') {
      if (cursor < 63) setCursor(cursor + 1);
    } else if (e.key === 'ArrowLeft') {
      if (cursor > 0) setCursor(cursor - 1);
    } else if (e.key === 'ArrowDown') {
      if (cursor + COLS < 64) setCursor(cursor + COLS);
    } else if (e.key === 'ArrowUp') {
      if (cursor - COLS >= 0) setCursor(cursor - COLS);
    }
  });

  // グリッド外クリックでカーソル解除
  document.addEventListener('click', (e) => {
    if (!gridEl.contains(e.target)) {
      cursor = null;
      render();
    }
  });
</script>

</body>
</html>
