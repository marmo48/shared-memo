<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>共有グリッド</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #fff;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      font-family: 'JetBrains Mono', monospace;
      user-select: none;
    }

    #canvas {
      position: absolute;
      top: 0; left: 0;
      cursor: text;
    }

    #ui {
      position: fixed;
      top: 12px;
      left: 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem;
      color: #bbb;
      letter-spacing: 0.05em;
      pointer-events: none;
      z-index: 100;
    }

    #ime {
      position: fixed;
      width: 1px;
      height: 1px;
      opacity: 0;
      border: none;
      outline: none;
      background: transparent;
      color: transparent;
      caret-color: transparent;
      font-size: 1rem;
      padding: 0;
      z-index: 9999;
    }
  </style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="ui">0, 0</div>
<input id="ime" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, onValue, update, off } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyC8wbN5gObR2tGkzOjwDSF5lNujRxLJ4bo",
    authDomain: "text-map-f6060.firebaseapp.com",
    databaseURL: "https://text-map-f6060-default-rtdb.firebaseio.com",
    projectId: "text-map-f6060",
    storageBucket: "text-map-f6060.firebasestorage.app",
    messagingSenderId: "640110471676",
    appId: "1:640110471676:web:75133b427ab91b2fa2aa79"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  // ---- 定数 ----
  const GRID_W = 1000, GRID_H = 1000;
  const CHUNK = 10; // チャンクサイズ
  const CELL = 22;  // 1マスのpx
  const SCALE_MIN = 0.3, SCALE_MAX = 4.0, SCALE_STEP = 0.08;

  // ---- 状態 ----
  let scale = 1.0;
  // ビューポート左上のグリッド座標（小数可）
  let viewX = Math.floor(Math.random() * (GRID_W - 40));
  let viewY = Math.floor(Math.random() * (GRID_H - 40));

  let cursor = null;   // {gx, gy} グリッド座標
  let anchorCol = null;
  let pending = '';

  // チャンクデータキャッシュ: "cx_cy" -> string[100]
  const chunkCache = {};
  // 購読中チャンク: "cx_cy" -> unsubscribe関数
  const subscriptions = {};

  // ---- Canvas ----
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const imeEl = document.getElementById('ime');
  const uiEl  = document.getElementById('ui');

  function resize() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
    draw();
  }
  window.addEventListener('resize', resize);

  // ---- チャンク管理 ----
  function chunkKey(cx, cy) { return `${cx}_${cy}`; }

  function getCell(gx, gy) {
    if (gx < 0 || gy < 0 || gx >= GRID_W || gy >= GRID_H) return '';
    const cx = Math.floor(gx / CHUNK), cy = Math.floor(gy / CHUNK);
    const key = chunkKey(cx, cy);
    const cache = chunkCache[key];
    if (!cache) return '';
    const lx = gx % CHUNK, ly = gy % CHUNK;
    return cache[ly * CHUNK + lx] || '';
  }

  function setCell(gx, gy, char) {
    if (gx < 0 || gy < 0 || gx >= GRID_W || gy >= GRID_H) return;
    const cx = Math.floor(gx / CHUNK), cy = Math.floor(gy / CHUNK);
    const key = chunkKey(cx, cy);
    if (!chunkCache[key]) chunkCache[key] = Array(CHUNK * CHUNK).fill('');
    const lx = gx % CHUNK, ly = gy % CHUNK;
    chunkCache[key][ly * CHUNK + lx] = char;
  }

  function subscribeChunk(cx, cy) {
    const key = chunkKey(cx, cy);
    if (subscriptions[key]) return;
    const r = ref(db, `map/chunks/${key}/flat`);
    const unsub = onValue(r, (snap) => {
      const data = snap.val();
      if (!chunkCache[key]) chunkCache[key] = Array(CHUNK * CHUNK).fill('');
      for (let i = 0; i < CHUNK * CHUNK; i++) {
        chunkCache[key][i] = data && data[i] !== undefined ? data[i] : '';
      }
      draw();
    });
    subscriptions[key] = () => { off(r); };
  }

  function unsubscribeChunk(cx, cy) {
    const key = chunkKey(cx, cy);
    if (!subscriptions[key]) return;
    subscriptions[key]();
    delete subscriptions[key];
  }

  // 現在画面に映っているチャンクを計算して購読を同期
  function syncSubscriptions() {
    const cols = Math.ceil(canvas.width  / (CELL * scale)) + 2;
    const rows = Math.ceil(canvas.height / (CELL * scale)) + 2;
    const startCX = Math.max(0, Math.floor(viewX / CHUNK) - 1);
    const startCY = Math.max(0, Math.floor(viewY / CHUNK) - 1);
    const endCX = Math.min(Math.floor(GRID_W / CHUNK) - 1, startCX + Math.ceil(cols / CHUNK) + 2);
    const endCY = Math.min(Math.floor(GRID_H / CHUNK) - 1, startCY + Math.ceil(rows / CHUNK) + 2);

    const needed = new Set();
    for (let cy = startCY; cy <= endCY; cy++) {
      for (let cx = startCX; cx <= endCX; cx++) {
        const key = chunkKey(cx, cy);
        needed.add(key);
        subscribeChunk(cx, cy);
      }
    }
    // 不要なチャンクを解除
    for (const key of Object.keys(subscriptions)) {
      if (!needed.has(key)) {
        const [cx, cy] = key.split('_').map(Number);
        unsubscribeChunk(cx, cy);
      }
    }
  }

  // ---- 描画 ----
  function gridToScreen(gx, gy) {
    return {
      sx: (gx - viewX) * CELL * scale,
      sy: (gy - viewY) * CELL * scale,
    };
  }

  function screenToGrid(sx, sy) {
    return {
      gx: Math.floor(sx / (CELL * scale) + viewX),
      gy: Math.floor(sy / (CELL * scale) + viewY),
    };
  }

  function draw() {
    const w = canvas.width, h = canvas.height;
    ctx.clearRect(0, 0, w, h);

    const cellPx = CELL * scale;
    const pendingChars = [...pending];
    const pendingLen = pendingChars.length;

    // 表示範囲
    const startGX = Math.floor(viewX);
    const startGY = Math.floor(viewY);
    const endGX = Math.min(GRID_W - 1, startGX + Math.ceil(w / cellPx) + 1);
    const endGY = Math.min(GRID_H - 1, startGY + Math.ceil(h / cellPx) + 1);

    // カーソルインデックス（描画用に線形化）
    const cursorIdx = cursor ? cursor.gy * GRID_W + cursor.gx : -1;

    ctx.font = `${Math.round(cellPx * 0.6)}px 'JetBrains Mono', monospace`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    for (let gy = startGY; gy <= endGY; gy++) {
      for (let gx = startGX; gx <= endGX; gx++) {
        const { sx, sy } = gridToScreen(gx, gy);

        // グリッド線
        ctx.strokeStyle = '#f4f4f4';
        ctx.lineWidth = 1;
        ctx.strokeRect(sx, sy, cellPx, cellPx);

        // 仮入力判定
        const linearIdx = gy * GRID_W + gx;
        const pendingOffset = cursor ? linearIdx - (cursor.gy * GRID_W + cursor.gx) : -1;
        const isPending = cursor && pendingOffset >= 0 && pendingOffset < pendingLen;
        const isCursorCell = cursor && (
          isPending
            ? linearIdx === cursorIdx + pendingLen - 1
            : linearIdx === cursorIdx
        );

        // カーソル背景
        if (isCursorCell || isPending) {
          ctx.fillStyle = '#f0f0f0';
          ctx.fillRect(sx, sy, cellPx, cellPx);
        }

        // 文字
        const char = isPending ? pendingChars[pendingOffset] : getCell(gx, gy);
        if (char) {
          ctx.fillStyle = isPending ? '#aaa' : '#222';
          ctx.fillText(char, sx + cellPx / 2, sy + cellPx / 2);
        }

        // カーソル下線
        if (isCursorCell) {
          ctx.fillStyle = '#444';
          const uw = cellPx * 0.5;
          const ux = sx + (cellPx - uw) / 2;
          const uy = sy + cellPx - cellPx * 0.15;
          ctx.fillRect(ux, uy, uw, Math.max(1, cellPx * 0.06));
        }
      }
    }

    updateUI();
  }

  // ---- UI ----
  function updateUI() {
    if (cursor) {
      uiEl.textContent = `${cursor.gx}, ${cursor.gy}`;
    } else {
      const cx = Math.round(viewX + canvas.width  / (CELL * scale) / 2);
      const cy = Math.round(viewY + canvas.height / (CELL * scale) / 2);
      uiEl.textContent = `${cx}, ${cy}`;
    }
  }

  // ---- IME位置 ----
  function moveIme() {
    if (cursor === null) return;
    const pendingLen = [...pending].length;
    const activeGX = pendingLen > 0 ? Math.min(cursor.gx + pendingLen - 1, GRID_W - 1) : cursor.gx;
    const activeGY = cursor.gy;
    const { sx, sy } = gridToScreen(activeGX, activeGY);
    const cellPx = CELL * scale;
    imeEl.style.left = (sx + cellPx + 4) + 'px';
    imeEl.style.top  = (sy + cellPx / 2 + 4) + 'px';
  }

  // ---- カーソル操作 ----
  function setCursor(gx, gy, isClick = false) {
    gx = Math.max(0, Math.min(GRID_W - 1, gx));
    gy = Math.max(0, Math.min(GRID_H - 1, gy));
    cursor = { gx, gy };
    pending = '';
    imeEl.value = '';
    if (isClick) anchorCol = gx;
    moveIme();
    imeEl.focus();
    draw();
  }

  // ---- Firebase書き込み ----
  async function commitPending() {
    if (!cursor || pending === '') return;
    const chars = [...pending];
    const updates = {};
    for (let j = 0; j < chars.length; j++) {
      const gx = cursor.gx + j;
      if (gx >= GRID_W) break;
      const gy = cursor.gy;
      const cx = Math.floor(gx / CHUNK), cy = Math.floor(gy / CHUNK);
      const key = chunkKey(cx, cy);
      const lx = gx % CHUNK, ly = gy % CHUNK;
      const idx = ly * CHUNK + lx;
      setCell(gx, gy, chars[j]);
      updates[`map/chunks/${key}/flat/${idx}`] = chars[j];
    }
    await update(ref(db), updates);
    cursor.gx = Math.min(cursor.gx + chars.length, GRID_W - 1);
    pending = '';
    imeEl.value = '';
  }

  async function commitAndThen(fn) {
    await commitPending();
    if (fn) fn();
  }

  // ---- イベント ----
  canvas.addEventListener('click', (e) => {
    const { gx, gy } = screenToGrid(e.clientX, e.clientY);
    if (gx >= 0 && gx < GRID_W && gy >= 0 && gy < GRID_H) {
      commitAndThen(() => setCursor(gx, gy, true));
    }
  });

  document.addEventListener('click', (e) => {
    if (e.target !== canvas) {
      commitPending().then(() => {
        cursor = null;
        anchorCol = null;
        draw();
      });
    } else if (cursor) {
      imeEl.focus();
    }
  });

  imeEl.addEventListener('input', () => {
    if (!cursor) return;
    pending = imeEl.value;
    moveIme();
    draw();
  });

  imeEl.addEventListener('keydown', async (e) => {
    if (!cursor) return;
    if (e.isComposing) return;

    if (e.key === 'Enter') {
      e.preventDefault();
      if (pending !== '') {
        await commitPending();
        draw();
      } else {
        // 改行：anchorColの列、一段下へ
        const nextGY = cursor.gy + 1;
        if (nextGY < GRID_H && anchorCol !== null) {
          setCursor(anchorCol, nextGY);
        }
      }
    } else if (e.key === 'ArrowRight') {
      e.preventDefault();
      await commitAndThen(() => setCursor(cursor.gx + 1, cursor.gy));
    } else if (e.key === 'ArrowLeft') {
      e.preventDefault();
      await commitAndThen(() => setCursor(cursor.gx - 1, cursor.gy));
    } else if (e.key === 'ArrowDown') {
      e.preventDefault();
      await commitAndThen(() => setCursor(cursor.gx, cursor.gy + 1));
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      await commitAndThen(() => setCursor(cursor.gx, cursor.gy - 1));
    } else if (e.key === 'Backspace' && pending === '') {
      e.preventDefault();
      const gx = cursor.gx > 0 ? cursor.gx - 1 : 0;
      const gy = cursor.gy;
      const cx = Math.floor(gx / CHUNK), cy = Math.floor(gy / CHUNK);
      const key = chunkKey(cx, cy);
      const idx = (gy % CHUNK) * CHUNK + (gx % CHUNK);
      setCell(gx, gy, '');
      await update(ref(db), { [`map/chunks/${key}/flat/${idx}`]: '' });
      setCursor(gx, gy);
    } else if (e.key === 'Escape') {
      pending = '';
      imeEl.value = '';
      cursor = null;
      anchorCol = null;
      imeEl.blur();
      draw();
    }
  });

  // ホイール：スクロール・拡大縮小
  window.addEventListener('wheel', (e) => {
    e.preventDefault();
    const delta = e.deltaY;

    if (e.ctrlKey || e.metaKey) {
      // 拡大縮小（マウス位置を中心に）
      const { gx: mx, gy: my } = screenToGrid(e.clientX, e.clientY);
      const prevScale = scale;
      scale += delta < 0 ? SCALE_STEP : -SCALE_STEP;
      scale = Math.max(SCALE_MIN, Math.min(SCALE_MAX, scale));
      // スケール変化後にマウス下のグリッド座標を維持
      viewX = mx - e.clientX / (CELL * scale);
      viewY = my - e.clientY / (CELL * scale);
    } else if (e.shiftKey) {
      // 左右スクロール
      viewX += delta / (CELL * scale);
    } else {
      // 上下スクロール
      viewY += delta / (CELL * scale);
    }

    viewX = Math.max(0, Math.min(GRID_W - 1, viewX));
    viewY = Math.max(0, Math.min(GRID_H - 1, viewY));

    syncSubscriptions();
    moveIme();
    draw();
  }, { passive: false });

  // ---- 初期化 ----
  resize();
  syncSubscriptions();
  draw();
</script>
</body>
</html>
