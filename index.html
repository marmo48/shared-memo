<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>共有グリッド</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'JetBrains Mono', monospace;
      gap: 2rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(8, 48px);
      grid-template-rows: repeat(8, 48px);
      border-left: 1px solid #e0e0e0;
      border-top: 1px solid #e0e0e0;
    }

    .cell {
      width: 48px;
      height: 48px;
      border-right: 1px solid #e0e0e0;
      border-bottom: 1px solid #e0e0e0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      color: #222;
    }

    input {
      border: none;
      border-bottom: 1.5px solid #ccc;
      outline: none;
      font-family: 'JetBrains Mono', monospace;
      font-size: 1rem;
      padding: 0.4rem 0.2rem;
      width: 384px;
      color: #222;
      background: transparent;
      transition: border-color 0.2s;
    }

    input:focus {
      border-bottom-color: #888;
    }

    input::placeholder {
      color: #ccc;
    }
  </style>
</head>
<body>

  <div class="grid" id="grid"></div>
  <input type="text" id="inputText" placeholder="入力してEnterで送信（64文字まで）" maxlength="64" />

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyC8wbN5gObR2tGkzOjwDSF5lNujRxLJ4bo",
    authDomain: "text-map-f6060.firebaseapp.com",
    databaseURL: "https://text-map-f6060-default-rtdb.firebaseio.com",
    projectId: "text-map-f6060",
    storageBucket: "text-map-f6060.firebasestorage.app",
    messagingSenderId: "640110471676",
    appId: "1:640110471676:web:75133b427ab91b2fa2aa79"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const gridRef = ref(db, 'sharedGrid');

  function renderGrid(flat) {
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    for (let i = 0; i < 64; i++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.textContent = flat[i] || '';
      grid.appendChild(cell);
    }
  }

  onValue(gridRef, (snapshot) => {
    const data = snapshot.val();
    const flat = data && data.flat ? data.flat : Array(64).fill('');
    renderGrid(flat);
  });

  document.getElementById('inputText').addEventListener('keydown', async (e) => {
    if (e.key !== 'Enter') return;
    const text = e.target.value;
    const flat = Array(64).fill('');
    for (let i = 0; i < Math.min(text.length, 64); i++) {
      flat[i] = text[i];
    }
    await set(gridRef, { flat });
    e.target.value = '';
  });
</script>

</body>
</html>
